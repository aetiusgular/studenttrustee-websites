name: Nightly data refresh

# Pulls official sources and commits what changed under studenttrustee/data/.
# Netlify deploys main on push, so a data commit is a deploy.
# 05:30 UTC is 22:30 Pacific: after the California Legislature's ~21:20 PT
# pubinfo drop and after the day's congressional roll calls are posted.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets: all boundaries federal california counties geo"
        default: "all"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python3 -m pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-refresh-cache-${{ github.run_id }}
          restore-keys: data-refresh-cache-

      - name: Refresh
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          TARGETS: ${{ github.event.inputs.targets || 'all' }}
        run: python3 -m tools.legislation.refresh $TARGETS

      - name: Validate
        run: python3 -m tools.legislation.validate

      - name: Commit and push
        run: |
          git config user.name "studenttrustee-bot"
          git config user.email "studenttrustee-bot@users.noreply.github.com"
          git add studenttrustee/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: nightly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
