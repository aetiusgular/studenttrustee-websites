name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: ubuntu-latest moves to a new release in October 2026, before Playwright and the
    # Python builds used here are known to support it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Legislation section's records live on the data branch (published by GitHub Pages).
      # The page tests and the data validator run against that snapshot.
      - name: Check out the published records (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: studenttrustee/data/legislation

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: npm ci
      - run: python3 -m pip install -r requirements.txt

      - name: Lint HTML and JS
        run: npm run lint

      - name: Committed output matches a fresh build
        run: npm run check:build

      - name: Pipeline parser tests (offline fixtures)
        run: python3 -m unittest discover -s tests/pipeline -t .

      - name: Data files are consistent
        run: python3 -m tools.legislation.validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility and layout checks (1440 / 768 / 390 / 320)
        run: npm run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/a11y-report.json
          retention-days: 14
