{%- macro video(v, label) -%}
{%- if v %}
  <figure class="video">
    <video controls preload="metadata"{% if v.poster %} poster="{{ v.poster }}"{% endif %} aria-label="{{ label }}">
      <source src="{{ v.src }}">
      <track kind="captions" src="{{ v.captions }}" srclang="en" label="English" default>
    </video>
  </figure>
{%- endif %}
{%- endmacro %}
